name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Require Apple Silicon
      run: test "$(uname -m)" = "arm64"
    - name: Package the Apple Silicon runtime
      run: ./mvnw -B -DskipTests -Pmac-aarch64 package
    - name: Check the Cocoa native
      run: unzip -l uis/target/macos/swt.jar | grep -q 'libswt-cocoa-'
